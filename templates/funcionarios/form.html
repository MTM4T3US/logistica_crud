{% extends "base.html" %}
{% block title %}{{ 'Editar' if funcionario else 'Novo' }} Funcionário{% endblock %}
{% block content %}
<h2>{{ 'Editar' if funcionario else 'Novo' }} Funcionário</h2>

<form method="POST" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="fun_nome" class="form-control" required
               value="{{ funcionario.fun_nome if funcionario else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="fun_email" class="form-control"
               value="{{ funcionario.fun_email if funcionario else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="fun_telefone" class="form-control"
               value="{{ funcionario.fun_telefone if funcionario else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Cidade</label>
        <select name="cid_codigo" class="form-select" required>
            <option value="">Selecione...</option>
            {% for c in cidades %}
            <option value="{{ c.cid_codigo }}"
                {% if funcionario and funcionario.cid_codigo == c.cid_codigo %}selected{% endif %}>
                {{ c.cid_nome }}/{{ c.cid_UF }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Departamento</label>
        <select name="dep_codigo" class="form-select" required>
            <option value="">Selecione...</option>
            {% for d in departamentos %}
            <option value="{{ d.dep_codigo }}"
                {% if funcionario and funcionario.dep_codigo == d.dep_codigo %}selected{% endif %}>
                {{ d.dep_nome }}
            </option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('funcionarios.listar') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
